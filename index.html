<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProtectTheGap — ช้อปให้สุด แต่อย่าลืมค่าส่ง</title>
<style>
  :root { --main:#00a88a; --main-dark:#00826b; --bg:#f3f5f6; --red:#e5484d; --text:#1d2327; --muted:#6b7780; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui, -apple-system, "Sukhumvit Set", "Noto Sans Thai", sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); padding-bottom:140px; }
  header { background:var(--main); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header button { background:none; border:0; color:#fff; font-size:15px; cursor:pointer; }
  .test-banner { background:#fff4d6; color:#7a5b00; font-size:12px; padding:6px 16px; text-align:center; }
  section { background:#fff; margin:10px 0; padding:14px 16px; }
  h2 { font-size:15px; margin:0 0 10px; }
  .hint { font-size:13px; color:var(--muted); margin:-4px 0 10px; }
  label { display:block; margin:12px 0 4px; font-size:14px; }
  input[type=number], input[type=text] { width:100%; padding:10px; font-size:16px; border:1px solid #ccd3d8; border-radius:6px; }
  .choices { display:flex; gap:8px; flex-wrap:wrap; }
  .choices label { margin:0; padding:8px 12px; border:1px solid #ccd3d8; border-radius:20px; font-size:14px; cursor:pointer; }
  .choices input { margin-right:4px; }
  .btn { display:block; width:100%; padding:13px; font-size:16px; border:0; border-radius:6px; background:var(--main); color:#fff; cursor:pointer; margin-top:16px; }
  .btn.ghost { background:#fff; color:var(--main); border:1px solid var(--main); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:8px; }
  .card { background:#fff; border-radius:6px; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .card .pic { font-size:44px; text-align:center; background:#eef8f6; border-radius:4px; padding:12px 0; }
  .card .name { font-size:14px; min-height:2.6em; }
  .card .price { color:var(--main-dark); font-weight:600; }
  .card button { padding:8px; border:1px solid var(--main); background:#fff; color:var(--main); border-radius:4px; cursor:pointer; font-size:14px; }
  .card button.in { background:var(--main); color:#fff; }
  .row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #eef0f2; }
  .row:last-child { border-bottom:0; }
  .row .ic { font-size:24px; width:32px; text-align:center; }
  .row .grow { flex:1; font-size:14px; }
  .row input[type=number] { width:96px; padding:6px; font-size:15px; text-align:right; }
  .row .x { border:0; background:none; color:var(--muted); font-size:18px; cursor:pointer; }
  .money { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .risk { border:1px solid #eef0f2; border-radius:6px; padding:10px; margin-bottom:10px; }
  .risk .top { display:flex; gap:8px; align-items:center; font-weight:600; }
  .risk .top .money { margin-left:auto; }
  .risk .line { display:flex; justify-content:space-between; font-size:13px; color:var(--main-dark); padding:2px 0 2px 32px; }
  .risk .own { display:flex; justify-content:space-between; font-weight:600; padding:6px 0 0 32px; border-top:1px dashed #dde2e5; margin-top:4px; }
  .risk .own.bad { color:var(--red); }
  .risk details { font-size:13px; color:var(--muted); padding-left:32px; }
  .voucher { display:flex; align-items:center; gap:10px; border:1px dashed var(--main); border-radius:6px; padding:10px; margin-bottom:8px; background:#f5fcfa; }
  .voucher .grow { flex:1; font-size:14px; }
  .voucher small { display:block; color:var(--muted); }
  .voucher button { padding:7px 12px; border-radius:4px; border:1px solid var(--main); background:#fff; color:var(--main); cursor:pointer; font-size:13px; }
  .voucher button.on { background:var(--main); color:#fff; }
  .voucher .free { font-size:13px; color:var(--main-dark); }
  .bottom { position:fixed; bottom:0; left:0; right:0; background:#fff; box-shadow:0 -2px 8px rgba(0,0,0,.08); z-index:5; }
  .bottom .inner { max-width:480px; margin:0 auto; padding:10px 16px; }
  .bar { font-size:13px; margin-bottom:6px; }
  .bar .lbl { display:flex; justify-content:space-between; }
  .bar .track { height:6px; background:#e6eaed; border-radius:3px; overflow:hidden; margin-top:3px; }
  .bar .fill { height:100%; background:var(--main); }
  .bar.bad .fill, .bar.bad .lbl b { background:var(--red); color:var(--red); }
  .bar.bad .lbl b { background:none; }
  .bottom .btn { margin-top:6px; padding:11px; }
  dialog { border:0; border-radius:10px; max-width:440px; width:calc(100% - 32px); padding:20px; }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog h2 { font-size:18px; }
  dialog ul { padding-left:18px; font-size:14px; }
  dialog p { font-size:14px; }
  .big { font-size:26px; font-weight:700; }
  .red { color:var(--red); } .green { color:var(--main-dark); }
  .muted { color:var(--muted); font-size:12px; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
</style>
</head>
<body>
<main id="app"></main>
<p id="status" class="sr-only" aria-live="polite"></p>
<dialog id="summary"></dialog>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
