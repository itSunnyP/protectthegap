<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProtectTheGap — ช้อปให้สุด แต่อย่าลืมค่าความเสี่ยง</title>
<style>
  @font-face { font-family:Anuphan; font-weight:400 700; font-display:swap; src:url(fonts/anuphan-thai.woff2) format('woff2'); unicode-range:U+02D7,U+0303,U+0331,U+0E01-0E5B,U+200C-200D,U+25CC; }
  @font-face { font-family:Anuphan; font-weight:400 700; font-display:swap; src:url(fonts/anuphan-latin.woff2) format('woff2'); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212; }
  :root {
    --main:#00806a; --main-dark:#006653; --tint:#e3f2ee; --bg:#f3f5f6; --line:#e3e7ea; --field:#8a959d;
    --red:#c62f35; --red-tint:#fdf1f1; --text:#1d2327; --muted:#56636b;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 Anuphan, "Sukhumvit Set", "Noto Sans Thai", system-ui, sans-serif; background:var(--bg); color:var(--text); caret-color:var(--main); accent-color:var(--main); -webkit-font-smoothing:antialiased; }
  ::selection { background:#bfe6db; color:var(--text); }
  :focus-visible { outline:2px solid var(--main); outline-offset:2px; }
  header :focus-visible { outline-color:#fff; }
  button, input { font:inherit; }
  .i { width:1em; height:1em; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.15em; }
  main { max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); padding-bottom:150px; }
  header { background:var(--main); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:20px; line-height:1.3; margin:0; flex:1; display:flex; align-items:center; gap:8px; letter-spacing:-.01em; }
  header button { display:inline-flex; align-items:center; gap:6px; min-height:40px; background:none; border:0; color:#fff; font-size:15px; cursor:pointer; padding:0 4px; }
  header button[aria-label] { font-size:22px; }
  .test-banner { display:flex; justify-content:center; align-items:center; gap:6px; background:#fff4d6; color:#7a5b00; font-size:13px; padding:6px 16px; }
  section { background:#fff; margin:10px 0; padding:18px 16px; }
  h2 { font-size:18px; line-height:1.35; font-weight:600; margin:0 0 8px; display:flex; align-items:center; gap:8px; text-wrap:balance; }
  h2 .i { color:var(--main-dark); }
  .hint { font-size:14px; color:var(--muted); margin:0 0 14px; }
  label { display:block; margin:16px 0 6px; font-size:15px; font-weight:500; }
  input[type=number], input[type=text] { width:100%; padding:10px 12px; font-size:16px; border:1px solid var(--field); border-radius:8px; background:#fff; color:var(--text); }
  input::placeholder { color:var(--muted); }
  .choices { display:flex; gap:8px; flex-wrap:wrap; }
  .choices label { margin:0; padding:8px 14px; border:1px solid var(--field); border-radius:999px; font-size:15px; font-weight:400; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .choices label:has(:checked) { border-color:var(--main); background:var(--tint); color:var(--main-dark); font-weight:600; }
  .choices input[type=radio] { margin:0; }
  .btn { display:flex; justify-content:center; align-items:center; gap:8px; width:100%; padding:13px; font-size:16px; font-weight:600; border:0; border-radius:8px; background:var(--main); color:#fff; cursor:pointer; margin-top:20px; }
  .btn:hover { background:var(--main-dark); }
  .btn:disabled { background:#d5dbdf; color:var(--muted); cursor:not-allowed; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 8px; }
  .card { background:#fff; border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .card .pic { display:grid; place-items:center; height:76px; background:var(--tint); color:var(--main-dark); border-radius:6px; font-size:32px; }
  .card .pic .i { stroke-width:1.75; }
  .card .name { font-size:15px; line-height:1.4; min-height:2.8em; }
  .card .price { color:var(--main-dark); font-weight:600; }
  .card .price .muted { font-weight:400; }
  .card button { display:flex; justify-content:center; align-items:center; gap:6px; min-height:40px; padding:8px; border:1px solid var(--main); background:#fff; color:var(--main-dark); border-radius:6px; cursor:pointer; font-size:14px; font-weight:500; }
  .card button.in { background:var(--main); color:#fff; }
  .row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .ic { display:grid; place-items:center; width:36px; height:36px; border-radius:6px; background:var(--tint); color:var(--main-dark); font-size:20px; }
  .row .grow { flex:1; min-width:0; overflow-wrap:anywhere; }
  .row input[type=number] { width:100px; padding:8px; font-size:15px; text-align:right; }
  .row .x { display:grid; place-items:center; width:44px; height:44px; margin-right:-10px; border:0; background:none; color:var(--muted); font-size:20px; cursor:pointer; border-radius:6px; }
  .row .x:hover { color:var(--red); background:var(--red-tint); }
  .money { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .risk { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; }
  .risk .top { display:flex; gap:8px; align-items:center; font-weight:600; }
  .risk .top .i { font-size:20px; color:var(--red); }
  .risk .top .money { margin-left:auto; font-size:17px; }
  .risk .line { display:flex; justify-content:space-between; gap:8px; font-size:14px; color:var(--main-dark); padding:2px 0 2px 28px; }
  .risk .line .i { margin-right:4px; }
  .risk .own { display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:600; padding:8px 0 0 28px; border-top:1px dashed var(--line); margin-top:6px; color:var(--main-dark); }
  .risk .own.bad { color:var(--red); }
  .risk details { font-size:14px; color:var(--muted); padding-left:28px; margin:2px 0 4px; }
  .risk summary { cursor:pointer; display:inline-flex; align-items:center; gap:4px; min-height:32px; }
  .voucher { display:flex; align-items:center; gap:10px; border:1px dashed var(--main); border-radius:8px; padding:12px; margin-bottom:8px; background:#f2f8f6; }
  .voucher > .i { font-size:22px; color:var(--main-dark); }
  .voucher .grow { flex:1; }
  .voucher small { display:block; color:var(--muted); font-size:13px; margin-top:2px; }
  .voucher button { display:inline-flex; align-items:center; gap:4px; min-height:40px; padding:0 14px; border-radius:6px; border:1px solid var(--main); background:#fff; color:var(--main-dark); cursor:pointer; font-size:14px; font-weight:500; white-space:nowrap; }
  .voucher button.on { background:var(--main); color:#fff; }
  .voucher .free { display:inline-flex; align-items:center; gap:4px; font-size:14px; font-weight:500; color:var(--main-dark); white-space:nowrap; }
  .bottom { position:fixed; bottom:0; left:0; right:0; background:#fff; box-shadow:0 -4px 16px rgba(29,35,39,.08); z-index:5; }
  .bottom .inner { max-width:480px; margin:0 auto; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bar { font-size:14px; margin-bottom:6px; }
  .bar .lbl { display:flex; justify-content:space-between; align-items:center; }
  .bar .lbl span { display:inline-flex; align-items:center; gap:6px; }
  .bar .track { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar .fill { height:100%; background:var(--main); }
  .bar.bad .fill { background:var(--red); }
  .bar.bad .lbl b { color:var(--red); }
  .bottom .btn { margin-top:8px; padding:12px; }
  dialog { border:0; border-radius:12px; max-width:440px; width:calc(100% - 32px); padding:24px 20px 20px; color:var(--text); box-shadow:0 12px 40px rgba(29,35,39,.25); }
  dialog::backdrop { background:rgba(29,35,39,.45); }
  dialog h2 { font-size:22px; margin-bottom:12px; }
  dialog ul { padding-left:20px; }
  dialog li { margin-bottom:6px; }
  dialog p { margin:0 0 8px; }
  .big { font-size:34px; line-height:1.2; font-weight:700; letter-spacing:-.02em; margin-bottom:12px; }
  .red { color:var(--red); } .green { color:var(--main-dark); }
  .muted { color:var(--muted); font-size:13px; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
</style>
</head>
